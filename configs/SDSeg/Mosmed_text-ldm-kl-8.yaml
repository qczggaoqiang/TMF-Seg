model:
  base_learning_rate: 1.0e-05
  target: ldm.models.diffusion.SDSeg.SDSeg
  params:
    num_classes: 2
    load_only_unet: true
    linear_start: 0.0015
    linear_end: 0.0155
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    loss_type: l1
    first_stage_key: segmentation
    cond_stage_key: image
    text_stage_key: text
    conditioning_key: concat
    image_size: 32
    channels: 4
    cond_stage_trainable: true
    concat_mode: true
    scale_by_std: true
    use_ema: true 
    monitor: val_avg_dice
    ckpt_path: models/ldm/lsun_churches256/model.ckpt
    use_text_conditioning: true

    scheduler_config:
      target: ldm.lr_scheduler.LambdaLinearScheduler
      params:
        warm_up_steps: [10000]
        cycle_lengths: [10000000000000]
        f_start: [1.0e-06]
        f_max: [1.0]
        f_min: [1.0]

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 32
        in_channels: 8
        out_channels: 4
        model_channels: 192
        attention_resolutions: [1, 2, 4, 8]
        num_res_blocks: 2
        channel_mult: [1, 2, 2, 4, 4]
        num_heads: 8
        use_scale_shift_norm: true
        resblock_updown: true
        dropout: 0.2

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ckpt_path: models/first_stage_models/kl-f8/model.ckpt
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [1, 2, 4, 4]
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: ldm.modules.encoders.modules.ImageTextFusionEmbedder
      params:
        embed_dim: 4
        fusion_type: cross_attn
        use_frequency_enhancement: true
        image_encoder_config:
          embed_dim: 4
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [1, 2, 4, 4]
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.2
          ckpt_path: models/first_stage_models/kl-f8/model.ckpt
        text_encoder_config:
          model_name: emilyalsentzer/Bio_ClinicalBERT
          max_length: 10
          freeze: false

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 8
    wrap: false
    train:
      target: ldm.data.mosmed_text.MosMedTrain
      params:
        size: 256
        use_text: true
        num_classes: 2
    validation:
      target: ldm.data.mosmed_text.MosMedValidation
      params:
        size: 256
        use_text: true
        num_classes: 2
    test:
      target: ldm.data.mosmed_text.MosMedTest
      params:
        size: 256
        use_text: true
        num_classes: 2

lightning:
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 2000
        max_images: 8
        increase_log_steps: false
        log_dice_frequency: 2000
  trainer:
    benchmark: true
    check_val_every_n_epoch: 2
    accumulate_grad_batches: 1
    #accelerator: gpu
    #gpus: "0,"